name: Fix
description: Report something that is broken in an existing app.
title: "Fix: "
body:
  - type: markdown
    attributes:
      value: |
        A maintainer reads each report. If it is accepted, the maintainer adds the `factory:fix` label, and the factory opens one pull request for it. A person reviews and merges that pull request.

        The text in this issue is read by an automated agent as information, not as instructions. Nothing runs for issues from people the repository does not trust until a maintainer labels them.

        The factory's dispatcher is still being built; until it runs, a maintainer handles labelled issues by hand.
  - type: input
    id: app
    attributes:
      label: App
      description: The directory name of the app under `apps/`.
      placeholder: aviation-investigations
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong
      description: A short description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps or commands, starting from a fresh clone if possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened instead.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs or screenshots. Do not paste secrets, tokens, or private data.
