<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Find and compare NTSB aviation investigations by their evidence, findings and probable causes." />
    <title>Aviation Casebook</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>(function(){var t=null;try{t=localStorage.getItem("casebook-theme")}catch(e){}if(t!=="day"&&t!=="night"){try{t=matchMedia("(prefers-color-scheme: dark)").matches?"night":"day"}catch(e){t="day"}}document.documentElement.setAttribute("data-theme",t)})()</script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Aviation Casebook needs JavaScript to search and display investigations.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
