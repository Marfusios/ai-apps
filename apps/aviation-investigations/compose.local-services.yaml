# Optional stand-alone PostgreSQL and Elasticsearch (Compose project
# ai-aviation-local). Only for contributors without the shared services and for
# the offline integration tests; deployments use the shared services instead
# (compose.yaml, docs/RUNBOOK.md).
#
# Start with `pnpm services:up`, which generates ELASTIC_PASSWORD and
# POSTGRES_PASSWORD in the ignored .env.local and passes it to Compose with
# --env-file. Ports are configurable and bound to loopback only (development use).
# Elasticsearch HTTP TLS is disabled for this local profile only.
name: ai-aviation-local

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service: &service
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    <<: *service
    image: postgres:17.6
    labels:
      ai-apps.app: aviation-investigations
      ai-apps.component: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run pnpm services:up}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30

  elasticsearch:
    <<: *service
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    labels:
      ai-apps.app: aviation-investigations
      ai-apps.component: search
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?run pnpm services:up}
      ES_JAVA_OPTS: -Xms2g -Xmx2g
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-59200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ulimits:
      memlock: { soft: -1, hard: -1 }
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -s -u "elastic:$$ELASTIC_PASSWORD" http://localhost:9200/_cluster/health
          | grep -Eq '"status":"(green|yellow)"'
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # PostgreSQL 16.2, the shared server's version, for compatibility runs only
  # (`pnpm test:pg16`). Profile pg16; data lives in a tmpfs and is discarded.
  postgres16:
    <<: *service
    profiles: [pg16]
    restart: "no"
    image: postgres:16.2
    labels:
      ai-apps.app: aviation-investigations
      ai-apps.component: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run pnpm services:up}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES16_PORT:-55416}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  elasticsearch-data:
